name: Deduplicate CloudFlare IPs

on:
  push:
    branches:
      - main
    paths:
      # 僅在修改 CloudFlare優選IP.txt 時觸發
      - 'CloudFlare優選IP.txt'
  # 保留手動觸發按鈕，便於隨時測試
  workflow_dispatch:

# 權限宣告：允許 Action 寫入倉庫以提交去重後的變更
permissions:
  contents: write

jobs:
  deduplicate:
    name: Check & Remove Duplicate IPs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deduplicate CloudFlare優選IP.txt
        run: |
          python3 - << 'EOF'
          from pathlib import Path

          target_file = Path("CloudFlare優選IP.txt")

          if not target_file.exists():
              print(f"[ERROR] Target file not found: {target_file}")
              exit(1)

          seen = set()
          deduped_lines = []
          duplicate_count = 0

          # 讀取並去重，嚴格保持原始順序並去除頭尾空格
          with open(target_file, "r", encoding="utf-8") as f:
              for line_number, raw_line in enumerate(f, 1):
                  clean_ip = raw_line.strip()
                  
                  if not clean_ip:
                      continue

                  if clean_ip in seen:
                      duplicate_count += 1
                      print(f"[DUP] Line {line_number}: Removed duplicate IP -> {clean_ip}")
                  else:
                      seen.add(clean_ip)
                      deduped_lines.append(clean_ip)

          # 只有在實際發現重複項時才覆寫檔案
          if duplicate_count > 0:
              with open(target_file, "w", encoding="utf-8", newline="\n") as f:
                  for ip in deduped_lines:
                      f.write(f"{ip}\n")
              print(f"[SUCCESS] Deduplication completed. Removed {duplicate_count} duplicate item(s).")
          else:
              print("[INFO] No duplicate IPs found. File is already clean.")
          EOF

      - name: Commit and push changes if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 檢測是否有內容變更（避免空提交）
          if ! git diff --quiet "CloudFlare優選IP.txt"; then
            echo "[INFO] Changes detected in CloudFlare優選IP.txt. Committing..."
            git add "CloudFlare優選IP.txt"
            # 加入 [skip ci] 防止 Action 自己推回檔案時形成無窮迴圈
            git commit -m "chore(auto): 移除 CloudFlare優選IP.txt 重複 IP [skip ci]"
            git push
            echo "[INFO] Successfully pushed cleaned file to repository."
          else
            echo "[INFO] No changes detected. Skipping commit."
          fi

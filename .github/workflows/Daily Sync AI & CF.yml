name: Daily Sync All

on:
  schedule:
    # 每天 UTC 20:00 (香港時間 04:00) 執行
    - cron: '0 20 * * *'
  workflow_dispatch: # 允許手動執行
  push:
    paths:
      - '**.py' # 當 Python 腳本修改時自動測試運行

jobs:
  sync-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 給予寫入權限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      # --- 1. 共用前置準備 ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      # ========================================================
      # 步驟 1: 下載 CF-IPs.txt (帶降級容錯保護，不單獨提交)
      # ========================================================
      - name: 下載 CF-IPs.txt
        env:
          CF_URL: ${{ secrets.CF_IP_URL }}
        run: |
          if [ -z "$CF_URL" ]; then
            echo "⚠️ 找不到 CF_IP_URL Secret，跳過 CF-IPs 下載。"
            exit 0
          fi
          
          echo "開始嘗試下載 CF-IPs..."
          if curl -sSL --retry 3 --connect-timeout 10 -o CF-IPs_temp.txt "$CF_URL" && [ -s CF-IPs_temp.txt ]; then
            mv CF-IPs_temp.txt CF-IPs.txt
            echo "✅ CF-IPs 下載成功！"
          else
            echo "⚠️ 外部 IP 伺服器無回應或檔案為空，跳過本次 CF-IPs 更新。"
            rm -f CF-IPs_temp.txt
          fi

      # ========================================================
      # 步驟 2: 安裝依賴 & 編譯工具 (Mihomo + Sing-box)
      # ========================================================
      - name: 安裝依賴 & 編譯工具
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install requests PyYAML

          echo "=== 下載並安裝 Mihomo ==="
          MIHOMO_URL=$(curl -s -H "Authorization: token ${GH_TOKEN}" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | \
            jq -r '.assets[] | select(.name | test("linux-amd64-v") and (test("compatible")|not) and endswith(".gz")) | .browser_download_url' | head -n 1)

          if [ -z "$MIHOMO_URL" ] || [ "$MIHOMO_URL" = "null" ]; then
            MIHOMO_URL="https://github.com/MetaCubeX/mihomo/releases/latest/download/mihomo-linux-amd64.gz"
          fi

          curl -sSL --retry 3 -o mihomo.gz "$MIHOMO_URL"
          gzip -f -d mihomo.gz
          sudo install -m 755 mihomo /usr/local/bin/mihomo
          rm -f mihomo.gz mihomo

          echo "=== 下載並安裝 Sing-box ==="
          SINGBOX_URL=$(curl -s -H "Authorization: token ${GH_TOKEN}" https://api.github.com/repos/SagerNet/sing-box/releases/latest | \
            jq -r '.assets[] | select(.name | contains("linux-amd64") and contains("tar.gz")) | .browser_download_url' | head -n 1)

          curl -sSL --retry 3 -o sing-box.tar.gz "$SINGBOX_URL"
          tar -zxf sing-box.tar.gz
          sudo install -m 755 sing-box-*/sing-box /usr/local/bin/sing-box
          rm -rf sing-box.tar.gz sing-box-*

          echo "=== 驗證安裝狀態 ==="
          mihomo -v
          sing-box version

      # ========================================================
      # 步驟 3: 執行腳本生成全套規則 & 編譯二進位
      # ========================================================
      - name: 執行整合腳本 & 編譯二進位規則
        run: |
          echo ">>> 1. 執行 sync_rules.py (生成 List/Json/Conf/Dae/Txt) <<<"
          python sync_rules.py

          echo ">>> 2. 執行二進位編譯 <<<"
          if [ -f "geosite_ai_hk_proxy.list" ]; then
            echo "編譯 MRS..."
            mihomo convert-ruleset domain text geosite_ai_hk_proxy.list geosite_ai_hk_proxy.mrs
          fi

          if [ -f "geosite_ai_hk_proxy.json" ]; then
            echo "編譯 SRS..."
            sing-box rule-set compile --output geosite_ai_hk_proxy.srs geosite_ai_hk_proxy.json
          fi

      # ========================================================
      # 步驟 4: 統一檢查變更、提交與推送 (全部檔案統一處理)
      # ========================================================
      - name: 統一提交與推送變更
        run: |
          git add .
          
          if git diff --staged --quiet; then
            echo "✅ 所有檔案內容完全一致，無需更新。"
          else
            current_time=$(TZ='Asia/Hong_Kong' date +'%Y-%m-%d %H:%M')
            git commit -m "🔄 自動更新 (📅 $current_time)"
            echo "🚀 檔案已更新並提交：🔄 自動更新 (📅 $current_time)"
            
            git pull --rebase origin main || true
            git push
          fi
